# Local only. The public site is the same image on k3s (deploy/k8s.yaml).
# Bind 0.0.0.0 inside the container; map 8080 on the host.
# Keys stay in .env / keys/ (gitignored) and are never baked into the image.
services:
  copilot:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATA_MODE: local
    env_file:
      - path: .env
        required: false
